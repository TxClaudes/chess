<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Review</title>
  <link rel="stylesheet" href="/static/vendor/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Game Review</h1>
    <div class="topbar-actions">
      <button id="download-json" class="btn btn-quiet" hidden>Download JSON</button>
      <button id="new-analysis" class="btn btn-quiet" hidden>New analysis</button>
    </div>
  </header>

  <!-- Input view -->
  <main id="input-view" class="input-view">
    <form id="pgn-form" class="card input-card">
      <h2>Analyse a game</h2>
      <label for="pgn-text" class="field-label">Paste PGN</label>
      <textarea id="pgn-text" name="pgn" rows="12" spellcheck="false" placeholder="[Event &quot;...&quot;]&#10;&#10;1. e4 e5 2. Nf3 ..."></textarea>
      <div class="input-row">
        <label class="file-label">
          <input id="pgn-file" type="file" name="file" accept=".pgn,.txt,text/plain">
          <span>Or choose a .pgn file</span>
        </label>
        <button type="button" id="load-example" class="btn btn-quiet">Load example game</button>
      </div>
      <div class="input-row">
        <label for="depth" class="field-label inline">Engine depth</label>
        <select id="depth" name="depth">
          <option value="12">12 (fast)</option>
          <option value="14">14</option>
          <option value="16">16</option>
          <option value="18" selected>18 (default)</option>
          <option value="20">20</option>
          <option value="22">22 (slow)</option>
        </select>
        <button type="submit" id="analyze-btn" class="btn btn-primary">Analyse</button>
      </div>
      <div id="progress" class="progress" hidden>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="progress-text">Starting…</span>
      </div>
      <pre id="input-error" class="error" hidden></pre>
    </form>
  </main>

  <!-- Review view -->
  <main id="review-view" class="review-view" hidden>
    <section class="board-area">
      <div class="player-strip" id="player-top"></div>
      <div class="board-row">
        <div id="eval-bar" class="eval-bar" aria-label="Evaluation bar">
          <div id="eval-fill" class="eval-fill"></div>
          <span id="eval-text" class="eval-text"></span>
        </div>
        <div class="board-wrap">
          <div id="board"></div>
          <svg id="overlay" class="overlay" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="player-strip" id="player-bottom"></div>
      <div class="controls">
        <button class="btn nav" data-nav="start" title="Start (Home)">⏮</button>
        <button class="btn nav" data-nav="prev" title="Previous (←)">◀</button>
        <button class="btn nav" data-nav="next" title="Next (→)">▶</button>
        <button class="btn nav" data-nav="end" title="End (End)">⏭</button>
        <button class="btn nav" id="flip" title="Flip board (F)">⇅</button>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card graph-card">
        <canvas id="eval-chart" aria-label="Win chance over the game" role="img"></canvas>
      </div>

      <div class="card move-card" id="move-card"></div>

      <div class="card summary-card" id="summary"></div>

      <div class="card moves-card">
        <div id="opening-name" class="opening-name"></div>
        <ol id="move-list" class="move-list"></ol>
      </div>
    </aside>
  </main>

  <script src="/static/vendor/jquery.min.js"></script>
  <script src="/static/vendor/chessboard-1.0.0.min.js"></script>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
